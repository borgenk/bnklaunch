name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, to catch drift in the runner image and the packages it installs.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit, with the version beside it.
jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary links libfreetype and libxkbcommon by name. The runner ships
      # the runtime shared objects but not the unversioned .so symlinks the
      # linker resolves -lfreetype and -lxkbcommon against, which the -dev
      # packages provide.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libxkbcommon-dev

      # The channel and the components come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: make fmt-check

      - name: Test the installer and the ABI floor
        run: make test-install test-abi

      - name: Clippy
        run: make clippy

      - name: Build
        run: cargo build --release

      - name: Test
        run: make test

  # The only job that builds the manifest, and the only one that compiles on the
  # SDK's nightly rather than the pinned one. Privileged because bwrap needs
  # user namespaces the runner does not otherwise grant.
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:9c6819dd59d5170dc5bdd9ceeb61dcb69e9429ae9f9c70b5554b34e905aaa54c # freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.borgenk.BnkLaunch.yml
          bundle: bnklaunch.flatpak
          # The manifest skips these two names, so the build cannot fold its own
          # output back into the app. The action's defaults are not.
          build-dir: build-dir
          repo-dir: flatpak-repo
          # The action's only restore-key is the prefix flatpak-builder-<arch>,
          # so a key without it restores another commit's build.
          cache-key: flatpak-builder-${{ github.sha }}

      # The errors this project accepts are in flatpak-lint-exceptions.json,
      # keyed by app id the way the linter reads them. Every other error fails.
      - name: Lint against Flathub's rules
        run: |
          lint() { flatpak-builder-lint --exceptions \
            --user-exceptions .github/flatpak-lint-exceptions.json "$@"; }
          lint manifest io.github.borgenk.BnkLaunch.yml
          lint repo flatpak-repo
