name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libxkbcommon-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: make fmt-check

      - name: Test the installer and the ABI floor
        run: make test-install test-abi

      - name: Clippy
        run: make clippy

      - name: Build
        run: cargo build --release

      - name: Test
        run: make test

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:9c6819dd59d5170dc5bdd9ceeb61dcb69e9429ae9f9c70b5554b34e905aaa54c # freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.borgenk.BnkLaunch.yml
          bundle: bnklaunch.flatpak
          build-dir: build-dir
          repo-dir: flatpak-repo
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Lint against Flathub's rules
        run: |
          lint() { flatpak-builder-lint --exceptions \
            --user-exceptions .github/flatpak-lint-exceptions.json "$@"; }
          lint manifest io.github.borgenk.BnkLaunch.yml
          lint repo flatpak-repo
