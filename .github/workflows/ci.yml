name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The binary links libfreetype and libxkbcommon by name. The runner ships
      # the runtime shared objects but not the unversioned .so symlinks the
      # linker resolves -lfreetype and -lxkbcommon against, which the -dev
      # packages provide.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libxkbcommon-dev

      # Nightly with rust-src: the build relies on -Z build-std, which rebuilds
      # the standard library from source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: make clippy

      - name: Build
        run: cargo build --release

      - name: Test
        run: make test
