name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit, with the version beside it.
jobs:
  version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release tarball is named from the Cargo.toml version, and install.sh
      # fetches it by the release tag. A mismatch would publish an asset the
      # installer cannot find, so fail before anything is built.
      - name: Compare tag against Cargo.toml
        run: |
          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  # CI does not run on tags, so the gate runs here before anything is built.
  gate:
    name: Gate
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libxkbcommon-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: make check

  # The bundle is built where the tarball cannot be: it needs bwrap and user
  # namespaces, which the runner grants only to a privileged container.
  flatpak:
    name: Flatpak bundle
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:9c6819dd59d5170dc5bdd9ceeb61dcb69e9429ae9f9c70b5554b34e905aaa54c # freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.borgenk.BnkLaunch.yml
          bundle: bnklaunch-${{ github.ref_name }}-x86_64.flatpak
          # The manifest skips these two names, so the build cannot fold its own
          # output back into the app. The action's defaults are not.
          build-dir: build-dir
          repo-dir: flatpak-repo
          # What ships is built from the checkout and nothing else.
          cache: false
          # The action names its artifact from the bundle. The bundle goes up
          # below, under a name the publish job can ask for.
          upload-artifact: false

      - name: Hand the bundle to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-bundle
          path: bnklaunch-${{ github.ref_name }}-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Build and publish
    needs: [gate, flatpak]
    runs-on: ubuntu-latest
    # The tarball takes its glibc and system libraries from whatever builds it,
    # so it is built in the oldest distribution it runs on.
    container: debian:12
    timeout-minutes: 30
    steps:
      # Ahead of the checkout, so the action has git to clone with. The binary
      # resolves -lfreetype and -lxkbcommon at link time, which needs the
      # unversioned .so symlinks the -dev packages carry.
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            make \
            libfreetype6-dev \
            libxkbcommon-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image has no rustup, and the toolchain it installs is the one
      # rust-toolchain.toml names.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Checks the ABI floor and writes the checksum the installer verifies.
      - name: Build release tarball
        run: make build-linux

      - name: Collect the Flatpak bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-bundle
          path: dist

      # make build-linux writes one for the tarball; the bundle arrives without.
      - name: Checksum the Flatpak bundle
        run: |
          cd dist
          for bundle in *.flatpak; do
            sha256sum "$bundle" > "$bundle.sha256"
          done

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
