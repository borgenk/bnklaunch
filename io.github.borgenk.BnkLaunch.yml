id: io.github.borgenk.BnkLaunch
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-nightly
command: bnklaunch

# A launcher lists applications installed on the host and runs host commands.
# The filesystem side below is read-only and limited to where desktop entries
# live, but flatpak-spawn can run anything the user can, so this bundle is a
# single-file install rather than a confined one.
finish-args:
  # A Wayland client end to end, drawing through a layer surface. Flatpak passes
  # the display through a security context socket, and a compositor that filters
  # privileged protocols by that can refuse zwlr_layer_shell_v1.
  - --socket=wayland

  # Where the applications are. host-os is the host's own /usr, bound under
  # /run/host, and the other two are the user's entries and the config file.
  # All read-only, and the rest of the home directory stays invisible. See
  # desktop::collect_data_dirs.
  - --filesystem=host-os:ro
  - --filesystem=xdg-data/applications:ro
  - --filesystem=xdg-config/bnklaunch:ro
  # How they start. Without it the launcher reads every desktop entry and runs
  # none of them. See launch::exec_target.
  - --talk-name=org.freedesktop.Flatpak
  # Flatpak binds none of its own exports, whatever else it is given, so an app
  # installed as a Flatpak is invisible without these. Metadata, read-only.
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro

# .cargo/config.toml and rust-toolchain.toml are skipped below. -Z build-std
# cannot run offline, since rebuilding the standard library needs its own
# crates.io dependencies, and it is worth about two kilobytes on a core-only
# binary. So the target moves to the command line, Cargo.toml's release profile
# supplies the panic strategy, and the extension's nightly is what compiles,
# rustup not being here to install the pinned one.
build-options:
  append-path: /usr/lib/sdk/rust-nightly/bin
  env:
    CARGO_HOME: /run/build/bnklaunch/cargo

modules:
  - name: bnklaunch
    buildsystem: simple
    build-commands:
      - cargo --offline --locked build --release --target x86_64-unknown-linux-gnu
      # Three system libraries and no crates. A fourth name means something
      # started linking what the runtime may not carry.
      - |
        needed=$(objdump -p target/x86_64-unknown-linux-gnu/release/bnklaunch |
          awk '$1 == "NEEDED" { print $2 }' | sort | paste -sd' ')
        if [ "$needed" != "libc.so.6 libfreetype.so.6 libxkbcommon.so.0" ]; then
          echo "the binary links $needed" >&2
          exit 1
        fi
      - install -Dm755 target/x86_64-unknown-linux-gnu/release/bnklaunch /app/bin/bnklaunch
      - install -Dm644 assets/io.github.borgenk.BnkLaunch.desktop
        /app/share/applications/io.github.borgenk.BnkLaunch.desktop
      - install -Dm644 assets/io.github.borgenk.BnkLaunch.metainfo.xml
        /app/share/metainfo/io.github.borgenk.BnkLaunch.metainfo.xml
      - install -Dm644 assets/icons/hicolor/scalable/apps/io.github.borgenk.BnkLaunch.svg
        /app/share/icons/hicolor/scalable/apps/io.github.borgenk.BnkLaunch.svg
    # No crates to vendor. The three system libraries come from the runtime.
    sources:
      - type: dir
        path: .
        skip:
          - .cargo
          - .claude
          - .flatpak-builder
          - .git
          - .github
          - build-dir
          - dist
          - flatpak-repo
          - perf
          - rust-toolchain.toml
          - target
          - tests
